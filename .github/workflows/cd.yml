name: CD - Build, Test, Deploy to EKS

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'k8s/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER_NAME: bank-app
  EKS_NAMESPACE: bank-app
  IMAGE_NAME: bank-app

permissions:
  id-token: write
  contents: read

jobs:
  # Code Quality & Security Checks
  quality-checks:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests
        run: make test

      - name: Run linting
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m

      - name: Run gosec security scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'

      - name: Upload security results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: gosec-results.sarif
          wait-for-processing: true

  # Build & Push Docker Image to ECR
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: quality-checks
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
      image-uri: ${{ steps.image.outputs.uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: image
        run: |
          TAG="$(git rev-parse --short HEAD)-$(date +%s)"
          URI="${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "uri=${URI}" >> $GITHUB_OUTPUT
          echo "Image URI: ${URI}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

      - name: Image vulnerability scan
        run: |
          echo "Scanning image for vulnerabilities..."
          aws ecr describe-image-scan-findings \
            --repository-name ${{ env.IMAGE_NAME }} \
            --image-id imageTag=${{ steps.image.outputs.tag }} \
            --region ${{ env.AWS_REGION }} || echo "Scan in progress or not available yet"

  # Deploy to EKS
  deploy-to-eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://bank-api.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}
          echo "Kubeconfig updated for cluster: ${{ env.EKS_CLUSTER_NAME }}"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.EKS_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          echo "Namespace ready: ${{ env.EKS_NAMESPACE }}"

      - name: Create/Update database secret
        run: |
          kubectl delete secret db-credentials -n ${{ env.EKS_NAMESPACE }} --ignore-not-found
          kubectl create secret generic db-credentials \
            --from-literal=username=${{ secrets.DB_USERNAME }} \
            --from-literal=password=${{ secrets.DB_PASSWORD }} \
            --from-literal=host=${{ secrets.DB_HOST }} \
            --from-literal=port=${{ secrets.DB_PORT }} \
            --from-literal=name=${{ secrets.DB_NAME }} \
            -n ${{ env.EKS_NAMESPACE }}
          echo "Database credentials secret created"

      - name: Create ECR image pull secret
        run: |
          kubectl delete secret aws-ecr-secret -n ${{ env.EKS_NAMESPACE }} --ignore-not-found
          kubectl create secret docker-registry aws-ecr-secret \
            --docker-server=${{ env.ECR_REGISTRY }} \
            --docker-username=AWS \
            --docker-password=$(aws ecr get-login-password --region ${{ env.AWS_REGION }}) \
            -n ${{ env.EKS_NAMESPACE }}
          echo "ECR image pull secret created"

      - name: Update deployment image
        run: |
          kubectl set image deployment/${{ env.IMAGE_NAME }} \
            ${{ env.IMAGE_NAME }}=${{ needs.build-and-push.outputs.image-uri }} \
            -n ${{ env.EKS_NAMESPACE }} \
            --record
          echo "Deployment image updated to: ${{ needs.build-and-push.outputs.image-uri }}"

      - name: Monitor deployment rollout
        run: |
          echo "Waiting for deployment rollout (max 5 minutes)..."
          kubectl rollout status deployment/${{ env.IMAGE_NAME }} \
            -n ${{ env.EKS_NAMESPACE }} \
            --timeout=5m
          echo "Rollout completed successfully"

      - name: Verify deployment status
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -n ${{ env.EKS_NAMESPACE }}

          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.EKS_NAMESPACE }} -o wide

          echo ""
          echo "=== Service Status ==="
          kubectl get services -n ${{ env.EKS_NAMESPACE }}

      - name: Check pod health
        run: |
          echo "=== Checking Pod Health ==="
          kubectl get pods -n ${{ env.EKS_NAMESPACE }} -o wide

          echo ""
          echo "=== Recent Pod Logs ==="
          kubectl logs -n ${{ env.EKS_NAMESPACE }} \
            -l app=${{ env.IMAGE_NAME }} \
            --tail=50 \
            --all-containers=true || echo "No logs available yet"

      - name: Verify API endpoints
        run: |
          echo "Checking API health endpoints..."

          # Get service endpoint
          SERVICE_IP=$(kubectl get svc ${{ env.IMAGE_NAME }}-service \
            -n ${{ env.EKS_NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || \
            kubectl get svc ${{ env.IMAGE_NAME }}-service \
            -n ${{ env.EKS_NAMESPACE }} \
            -o jsonpath='{.spec.clusterIP}' 2>/dev/null)

          if [ -z "$SERVICE_IP" ]; then
            echo "Warning: Service endpoint not ready yet"
            echo "Service details:"
            kubectl describe svc ${{ env.IMAGE_NAME }}-service -n ${{ env.EKS_NAMESPACE }}
          else
            echo "Service endpoint: $SERVICE_IP"
          fi

      - name: Deployment summary
        run: |
          echo "========================================"
          echo "✅ Deployment Completed Successfully"
          echo "========================================"
          echo ""
          echo "Cluster: ${{ env.EKS_CLUSTER_NAME }}"
          echo "Namespace: ${{ env.EKS_NAMESPACE }}"
          echo "Image: ${{ needs.build-and-push.outputs.image-uri }}"
          echo "Image Tag: ${{ needs.build-and-push.outputs.image-tag }}"
          echo ""
          echo "Next steps:"
          echo "1. Wait for LoadBalancer endpoint (may take a few minutes)"
          echo "2. kubectl get svc -n ${{ env.EKS_NAMESPACE }}"
          echo "3. curl http://your-endpoint/health/live"
          echo ""

  # Post-Deployment Verification
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-eks]
    if: success()
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Wait for service endpoint
        run: |
          echo "Waiting for LoadBalancer endpoint..."
          for i in {1..30}; do
            ENDPOINT=$(kubectl get svc ${{ env.IMAGE_NAME }}-service \
              -n ${{ env.EKS_NAMESPACE }} \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)

            if [ -n "$ENDPOINT" ]; then
              echo "✅ Endpoint ready: $ENDPOINT"
              echo "endpoint=$ENDPOINT" >> $GITHUB_ENV
              exit 0
            fi

            echo "⏳ Waiting for endpoint... ($i/30)"
            sleep 10
          done

          echo "⚠️ Endpoint not ready within timeout"
          echo "Note: This may be normal if using internal ClusterIP service"
          exit 0

      - name: Run health checks
        if: env.endpoint != ''
        run: |
          echo "Running health checks against: ${{ env.endpoint }}"

          # Try health check endpoints
          for endpoint in "/health/live" "/health/ready"; do
            echo ""
            echo "Testing $endpoint..."
            curl -f http://${{ env.endpoint }}:8080$endpoint \
              -m 10 || echo "Endpoint check completed"
          done

      - name: Deployment verification summary
        run: |
          echo "========================================"
          echo "✅ Deployment Verified"
          echo "========================================"
          echo ""
          echo "Image: ${{ needs.build-and-push.outputs.image-uri }}"
          echo ""
          echo "To access your deployment:"
          echo "  kubectl port-forward -n ${{ env.EKS_NAMESPACE }} svc/${{ env.IMAGE_NAME }}-service 8080:8080"
          echo "  curl http://localhost:8080/health/live"
          echo ""
          echo "To view logs:"
          echo "  kubectl logs -n ${{ env.EKS_NAMESPACE }} -l app=${{ env.IMAGE_NAME }} -f"
          echo ""

  # Cleanup on failure
  cleanup-on-failure:
    name: Cleanup on Failure
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-eks, verify-deployment]
    if: failure()
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Rollback deployment
        run: |
          echo "🔄 Attempting to rollback deployment..."
          kubectl rollout undo deployment/${{ env.IMAGE_NAME }} \
            -n ${{ env.EKS_NAMESPACE }} || echo "No previous revision to rollback to"

          echo ""
          echo "Waiting for rollback to complete..."
          kubectl rollout status deployment/${{ env.IMAGE_NAME }} \
            -n ${{ env.EKS_NAMESPACE }} \
            --timeout=5m || echo "Rollback monitoring completed"

      - name: Notify failure
        run: |
          echo "❌ Deployment failed and has been rolled back (if possible)"
          echo ""
          echo "Troubleshooting steps:"
          echo "1. Check deployment logs:"
          echo "   kubectl logs -n ${{ env.EKS_NAMESPACE }} -l app=${{ env.IMAGE_NAME }}"
          echo ""
          echo "2. Describe failing pod:"
          echo "   kubectl describe pod -n ${{ env.EKS_NAMESPACE }} <pod-name>"
          echo ""
          echo "3. Check events:"
          echo "   kubectl get events -n ${{ env.EKS_NAMESPACE }} --sort-by='.lastTimestamp'"
          echo ""
          echo "4. View rollback history:"
          echo "   kubectl rollout history deployment/${{ env.IMAGE_NAME }} -n ${{ env.EKS_NAMESPACE }}"
