# 
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running CD manually? (shows up in logs)'
        required: false
        default: 'manual deploy'

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ─── 1. Build + push every service image in parallel ─────────────────────
  docker:
    name: Build & push · bank-app
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       (github.event.workflow_run.head_branch == 'main' ||
        startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write     # future-proof for GHCR push
    strategy:
      fail-fast: false
    steps:
      - name: Resolve commit SHA + branch
        id: ctx
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            SHA="${{ github.sha }}"
            BRANCH="${{ github.ref_name }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          fi
          {
            echo "sha=$SHA"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout (commit ${{ steps.ctx.outputs.sha }})
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.ctx.outputs.sha }}

      - name: Resolve Docker Hub namespace
        id: ns
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::Set repo variable DOCKERHUB_NAMESPACE or secret DOCKERHUB_USERNAME"
            exit 1
          fi
          echo "namespace=$DOCKERHUB_NAMESPACE" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ns.outputs.namespace }}/bank
          tags: |
            type=sha,format=short,prefix=sha-,sha=${{ steps.ctx.outputs.sha }}
            type=raw,value=${{ steps.ctx.outputs.branch }}
            type=raw,value=latest,enable=${{ steps.ctx.outputs.branch == 'main' }}

      - name: Build & push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bank
          cache-to: type=gha,mode=max,scope=bank
          provenance: false

      - name: Job summary
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## docker · bank → **${{ job.status }}**"
            echo ""
            echo "Tags pushed:"
            echo ""
            echo "$TAGS" | sed 's|^|- `|;s|$|`|'
            if [ -n "$DIGEST" ]; then
              echo ""
              echo "Digest: \`$DIGEST\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── 2. Bump kustomization image tags + commit back to main ──────────────
  update-manifests:
    name: Bump k8s image tags
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write     # to push the bump commit back to main
    outputs:
      bumped_sha: ${{ steps.commit.outputs.bump_sha }}
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Resolve Docker Hub namespace
        id: ns
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::Set repo variable DOCKERHUB_NAMESPACE or secret DOCKERHUB_USERNAME"
            exit 1
          fi
          echo "namespace=$DOCKERHUB_NAMESPACE" >> "$GITHUB_OUTPUT"

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.4.3'

      - name: Compute tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            SHA="${{ github.sha }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          SHORT="${SHA:0:7}"
          echo "value=sha-${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Bump image tags
        working-directory: k8s/base
        env:
          NS: ${{ steps.ns.outputs.namespace }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          kustomize edit set image \
            "docker.io/${NS}/bank=docker.io/${NS}/bank:${TAG}"
          echo "── kustomization.yaml after bump ──"
          cat kustomization.yaml

      - name: Commit & push
        id: commit
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          if git diff --quiet k8s/base/kustomization.yaml; then
            echo "::notice::Image tags already at ${TAG} — no commit needed."
            {
              echo "## Manifest bump → **skipped**"
              echo ""
              echo "Image tags in \`k8s/base/kustomization.yaml\` already point at \`${TAG}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/base/kustomization.yaml
          git commit -m "chore(k8s): bump image tags to ${TAG} [skip ci]"
          git push origin HEAD:main
          BUMP=$(git rev-parse HEAD)
          echo "bump_sha=$BUMP" >> "$GITHUB_OUTPUT"
          {
            echo "## Manifest bump → **committed**"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| New tag       | \`${TAG}\` |"
            echo "| Bump commit   | \`${BUMP:0:7}\` (full: \`$BUMP\`) |"
            echo "| Pushed to     | \`main\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── 3. Seed bank-app-secrets in the cluster from GH Secrets ─────────────
  seed-secrets:
    name: Seed cluster secrets
    needs: update-manifests
    if: vars.EKS_CLUSTER_NAME != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write     # OIDC -> AWS IAM role assumption
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Validate required Secrets are set
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          DB_SOURCE: ${{ secrets.DB_SOURCE }}
        run: |
          set -euo pipefail
          missing=()
          for v in AWS_ROLE_TO_ASSUME DB_SOURCE; do
            if [ -z "${!v}" ]; then
              missing+=("$v")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required Secrets: ${missing[*]}"
            echo "::error::Set them in Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All required Secrets present."

      - name: Configure AWS + kubectl
        uses: ./.github/actions/aws-eks-kubectl
        with:
          aws-role: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          eks-cluster: ${{ vars.EKS_CLUSTER_NAME }}

      - name: Apply kustomized manifests
        run: kubectl apply -k k8s/base/

      - name: Apply bank-app-secrets (idempotent)
        env:
          DB_SOURCE: ${{ secrets.DB_SOURCE }}
        run: |
          set -euo pipefail
          args=(
            --from-literal=DB_SOURCE="$DB_SOURCE"
          
          )
          kubectl create secret generic bank-app-secrets \
            --namespace bank-app \
            "${args[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          if [ '${{ job.status }}' = 'success' ]; then
            TS=$(kubectl -n bank-app get secret bank-app-secrets \
                   -o jsonpath='{.metadata.creationTimestamp}' 2>/dev/null || echo unknown)
            {
              echo "## seed-secrets → **success**"
              echo ""
              echo "\`bank-app-secrets\` confirmed in namespace \`bank-app\` (created **$TS**)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## seed-secrets → **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─── 4. Apply the EKS overlay + wait for rollout ─────────────────────────
  deploy:
    name: Deploy to EKS
    needs: [update-manifests, seed-secrets]
    if: vars.EKS_CLUSTER_NAME != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    environment:
      name: production-eks
      url: ${{ steps.url.outputs.app_url }}
    steps:
      # If update-manifests committed a bump, deploy that exact SHA so we
      # never race a concurrent push. Falls back to main HEAD when nothing
      # was bumped (re-run with no code change → manifests already current).
      - name: Checkout deploy ref
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.update-manifests.outputs.bumped_sha || 'main' }}
          fetch-depth: 1

      - name: Configure AWS + kubectl
        uses: ./.github/actions/aws-eks-kubectl
        with:
          aws-role: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          eks-cluster: ${{ vars.EKS_CLUSTER_NAME }}

      - name: Apply EKS overlay (kubectl built-in kustomize)
        run: |
          set -euo pipefail
          kubectl apply -k k8s/overlays/production/

      - name: Wait for rollout (5m per deployment)
        run: |
          set -euo pipefail
          {
            echo "## Rollout"
            echo ""
            echo "| Deployment | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for d in bank-api; do
            echo "── rollout: $d ──"
            if kubectl -n bank-app rollout status "deployment/$d" --timeout=5m; then
              echo "| \`$d\` | OK |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$d\` | **FAILED** |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          done
          exit "$fail"

      - name: Resolve public URL
        id: url
        run: |
          set -euo pipefail
          HOST=$(kubectl -n ingress-nginx get svc ingress-nginx-controller \
                   -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          if [ -z "$HOST" ]; then
            echo "::warning::ingress-nginx ELB has no hostname yet (still provisioning?)"
            kubectl -n ingress-nginx get svc ingress-nginx-controller
            exit 0
          fi
          URL="http://$HOST"
          echo "app_url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "## Live URL"
            echo ""
            echo "[$URL]($URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Smoke test ───────────────────────────────────────────────────────
      # Verifies the cluster is actually serving traffic end-to-end:
      #   1. GET  /         — confirms ingress-nginx routes to `web` and the
      #                       SPA is being served (200 + non-empty body).
      #
      # ELBs occasionally take 30-60 s after a fresh provision before all AZs
      # answer, so we retry each probe up to 12× with 10 s backoff (~2 min total).
      # Skipped automatically when the URL step couldn't resolve a hostname.
      - name: Smoke test (web + accounts)
        if: steps.url.outputs.app_url != ''
        env:
          URL: ${{ steps.url.outputs.app_url }}
        run: |
          set -euo pipefail
          retry() {
            local label="$1"; shift
            local attempt=0
            until "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 12 ]; then
                echo "::error::${label} failed after ${attempt} attempts"
                return 1
              fi
              echo "${label}: attempt ${attempt} failed, retrying in 10 s…"
              sleep 10
            done
            echo "${label}: OK on attempt $((attempt + 1))"
          }
          probe_web() {
            curl --fail --silent --show-error --location \
                 --max-time 10 --output /tmp/web.html "${URL}/accounts?page_id=1&page_size=5"
            test -s /tmp/web.html
          }
          web_status=fail         
          retry 'GET /'         probe_web     && web_status=ok     || true
          {
            echo "## Smoke test"
            echo ""
            echo "| Probe | Result |"
            echo "| --- | --- |"
            echo "| \`GET ${URL}/accounts?page_id=1&page_size=5\` | ${web_status} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$web_status" != ok ]; then
            echo "::error::Smoke test failed (web=${web_status}"
            exit 1
          fi
