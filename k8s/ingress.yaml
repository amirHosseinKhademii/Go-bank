---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bank-app-network-policy
  namespace: bank-app
spec:
  podSelector:
    matchLabels:
      app: bank-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: bank-app
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  - to:
    - podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bank-app-ingress
  namespace: bank-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/rate-limit: "100"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.bank.example.com
    secretName: bank-app-tls
  rules:
  - host: api.bank.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bank-app-service
            port:
              number: 80
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ServiceAccount
metadata:
  name: bank-app
  namespace: bank-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bank-app
  namespace: bank-app
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bank-app
  namespace: bank-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bank-app
subjects:
- kind: ServiceAccount
  name: bank-app
  namespace: bank-app
