---
apiVersion: v1
kind: Namespace
metadata:
  name: bank-app
  labels:
    name: bank-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: bank-app
data:
  DB_DRIVER: postgresql
  GIN_MODE: release
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: bank-app
type: Opaque
stringData:
  DB_SOURCE: "postgresql://admin:password@postgres-service:5432/bank?sslmode=disable"
  ANTHROPIC_API_KEY: ""
---
apiVersion: policy/v1
kind: PodSecurityPolicy
metadata:
  name: restricted
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'MustRunAs'
    seLinuxOptions:
      level: "s0:c123,c456"
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535
  readOnlyRootFilesystem: false
