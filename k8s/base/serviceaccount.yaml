apiVersion: rbac.authorization.k8s.io/v1
kind: ServiceAccount
metadata:
  name: bank-app
  namespace: bank-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bank-app
  namespace: bank-app
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bank-app
  namespace: bank-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bank-app
subjects:
  - kind: ServiceAccount
    name: bank-app
    namespace: bank-app
