apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bank-app

resources:
  - ../../base

labels:
  - pairs:
      environment: local
      minikube: "true"

replicas:
  - name: bank-app
    count: 1

patches:
  # Patch deployment for minikube
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: bank-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
        value: 10
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
        value: 5

  # Change service type to NodePort for minikube
  - target:
      version: v1
      kind: Service
      name: bank-app-service
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort

  # Disable ingress TLS for local testing
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: bank-app-ingress
    patch: |-
      - op: replace
        path: /spec/tls
        value: []
      - op: replace
        path: /spec/ingressClassName
        value: nginx

configMapGenerator:
  - name: bank-app-config
    envs:
      - env.properties

secretGenerator:
  - name: db-credentials
    envs:
      - db-secret.properties
