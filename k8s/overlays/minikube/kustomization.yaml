
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# For local dev we generally want the newest pushed images. The production base
# pins to immutable short-SHA tags; this overlay overrides them to `main`.
images:
  - name: docker.io/amir2575/bank
    newTag: latest

patches:
  # ── Disable hostname requirement for minikube (HTTP-only environment) ────
  - target:
      kind: Ingress
      name: bank-api-ingress
    patch: |-
      - op: remove
        path: /spec/rules/0/host

  # ── Scale every deployment to 1 replica to fit a laptop-sized cluster ──
  # We use a strategic-merge patch and a label selector so this single
  # patch applies to every Deployment in the base.
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # ── Force a fresh image pull on every Pod restart ──────────────────────
  # Minikube reuses cached images by default (`IfNotPresent`). When you want
  # "always pull whatever is currently in the registry tag", flip to `Always`.
  - target:
      kind: Deployment
      name: bank-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

