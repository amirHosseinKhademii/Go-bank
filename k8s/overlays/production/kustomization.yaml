apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bank-app

resources:
  - ../../base

labels:
  - pairs:
      environment: production
      managed-by: terraform

replicas:
  - name: bank-app
    count: 3

patches:
  # Production deployment settings
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: bank-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
        value: 30
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
        value: 10

configMapGenerator:
  - name: bank-app-config
    envs:
      - env.properties

secretGenerator:
  - name: db-credentials
    envs:
      - db-secret.properties
